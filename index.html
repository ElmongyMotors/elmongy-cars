<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Elmongy Motors — Авто из Кореи</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
    body { margin: 0; font-family: 'Inter', sans-serif; background: #0a0a0a; color: #fff; scroll-behavior: smooth; }
    
    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 5%; background: rgba(0,0,0,0.95); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #222;
    }
    .logo-box { display: flex; align-items: center; }
    .logo-box img { height: 45px; margin-right: 12px; }
    .logo-text { font-weight: 900; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; }

    .social-icons a { color: #fff; margin-left: 18px; font-size: 22px; transition: 0.3s; text-decoration: none; }
    .social-icons a:hover { color: #e63946; }

    header {
      background: linear-gradient(rgba(0,0,0,0.4), rgba(10,10,10,1)), url('https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?q=80&w=2070');
      background-size: cover; background-position: center; padding: 100px 5%; text-align: center;
    }
    h1 { font-size: 50px; font-weight: 900; text-transform: uppercase; margin: 0; }
    .accent { color: #e63946; }

    section { padding: 60px 5%; max-width: 1200px; margin: 0 auto; }
    h2 { font-size: 32px; font-weight: 900; text-transform: uppercase; margin-bottom: 40px; border-left: 5px solid #e63946; padding-left: 20px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
    .car-card { background: #161616; padding: 20px; border-radius: 20px; border: 1px solid #222; }
    .car-card img { width: 100%; border-radius: 12px; height: 200px; object-fit: cover; }
    .price { color: #e63946; font-weight: 900; font-size: 24px; margin-top: 10px; }

    .form-container { background: #e63946; padding: 40px; border-radius: 25px; text-align: center; margin-top: 40px; }
    input { width: 100%; padding: 18px; margin-bottom: 12px; border-radius: 10px; border: none; font-size: 16px; box-sizing: border-box; }
    .btn-send { background: #000; color: #fff; border: none; padding: 20px; border-radius: 10px; font-weight: 900; text-transform: uppercase; cursor: pointer; width: 100%; }
  </style>
</head>
<body>

<nav>
  <div class="logo-box">
    <img src="https://i.ibb.co/LkhYt6P/logo.png" alt="Elmongy Logo">
    <div class="logo-text">ELMONGY <span class="accent">MOTORS</span></div>
  </div>
  
  <div class="social-icons">
    <a href="https://api.whatsapp.com/send/?phone=821051068878" target="_blank"><i class="fab fa-whatsapp"></i></a>
    <a href="https://t.me/elmongy12" target="_blank"><i class="fab fa-telegram"></i></a>
    <a href="https://vk.com/elmongy_motors" target="_blank"><i class="fab fa-vk"></i></a>
    <a href="https://instagram.com/elmongy_russia" target="_blank"><i class="fab fa-instagram"></i></a>
  </div>
</nav>

<header>
  <h1>АВТОМОБИЛИ ИЗ <span class="accent">КОРЕИ</span></h1>
  <p>Профессиональный подбор и доставка под ключ</p>
</header>

<section id="examples">
  <h2>Примеры авто</h2>
  <div class="grid">
    <div class="car-card">
      <img src="https://images.unsplash.com/photo-1707156372103-689369324021" alt="Palisade">
      <h3>Hyundai Palisade 2026</h3>
      <div class="price">8.28 млн руб.</div>
    </div>
    <div class="car-card">
      <img src="https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb" alt="Carnival">
      <h3>Kia Carnival 2024</h3>
      <div class="price">от 4.5 млн руб.</div>
    </div>
  </div>

  <div class="form-container">
    <h2 style="border:none; padding:0; color:#fff; margin-bottom:10px;">Оставить заявку</h2>
    <form action="https://formspree.io/f/mqpelowa" method="POST">
      <input type="text" name="name" placeholder="Ваше имя" required>
      <input type="tel" name="phone" placeholder="Ваш WhatsApp / Телефон" required>
      <button type="submit" class="btn-send">Получить расчет</button>
    </form>
  </div>
</section>

</body>
</html>
