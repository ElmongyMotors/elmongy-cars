<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Elmongy Motors — авто из Кореи</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f2f5;
      color: #333;
    }
    header {
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                  url('https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?q=80&w=2070&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      color: #fff;
      padding: 60px 20px;
      text-align: center;
    }
    .container { padding: 20px; max-width: 800px; margin: 0 auto; }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .car-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .car-item img {
      width: 100%;
      border-radius: 8px;
      height: 150px;
      object-fit: cover;
    }
    .car-item h3 { font-size: 16px; margin: 10px 0 5px; }
    .price { color: #0077ff; font-weight: bold; }
    button {
      width: 100%;
      padding: 16px;
      background: #0077ff;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background: #005fd1; transform: translateY(-2px); }
    .wa-button { background: #25d366; margin-top: 10px; }
    @media (max-width: 600px) { .car-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<header>
  <h1>Elmongy Motors</h1>
  <p>Профессиональный подбор и доставка авто из Южной Кореи</p>
</header>

<div class="container">
  <div class="card">
    <h2>Примеры авто из Кореи</h2>
    <div class="car-grid">
      <div class="car-item">
        <img src="https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?q=80&w=2070&auto=format&fit=crop" alt="Kia Carnival">
        <h3>Kia Carnival</h3>
        <p class="price">от 3.8 млн руб.</p>
      </div>
      <div class="car-item">
        <img src="https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?q=80&w=2070&auto=format&fit=crop" alt="Hyundai Palisade">
        <h3>Hyundai Palisade</h3>
        <p class="price">от 4.2 млн руб.</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Оставить заявку</h2>
    <p>Свяжитесь с нами напрямую для бесплатного расчета стоимости:</p>
    <button onclick="window.location.href='https://api.whatsapp.com/send/?phone=821051068878'">Написать в WhatsApp</button>
    <button class="wa-button" onclick="window.location.href='https://t.me/ваш_логин'">Написать в Telegram</button>
  </div>
</div>

<footer>
  <center><p>© 2026 Elmongy Motors</p></center>
</footer>

</body>
</html>
